[package]
name = "theseus_gui"
# The actual version is set by the theseus-build workflow on tagging
version = "1.10.4"
edition.workspace = true
description = "Galaxy宝可梦: the launcher for the Galaxy宝可梦 Minecraft server, based on Axolotl Launcher and the Modrinth launcher (Theseus)"
license = "GPL-3.0-only"

[dependencies]
async_zip = { workspace = true, features = ["deflate", "tokio-fs"] }
chrono = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
enumset = { workspace = true, features = ["serde"] }
fontdb = { workspace = true }
futures = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
image = { workspace = true }
keyring = { workspace = true }
# Galaxy宝可梦 (slimming phase 2): the MCP plugin is gone and nothing references these two crates any more,
# so none of their code is linked. They stay listed only because dropping them changes the resolved
# features of shared deps (hyper-util, tower, axum via rmcp), which forces a full app-lib rebuild that
# does not fit the build machine's free RAM. Remove them together with a planned full rebuild.
launcher-mcp = { workspace = true }
launcher-tools = { workspace = true }
libc = { workspace = true }
native-dialog = { workspace = true }
notify = { workspace = true }
paste = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha2 = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
theseus = { workspace = true, features = ["tauri"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tracing = { workspace = true }
tracing-error = { workspace = true }
trash = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dependencies.tauri]
workspace = true
features = [
  "devtools",
  "macos-private-api",
  "protocol-asset",
  "tray-icon",
  "unstable"
]

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = [
  "async-io",
  "settings",
] }
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSColor",
  "NSColorSpace",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSNotification",
  "NSObjCRuntime",
  "NSOperation",
  "NSRunLoop",
  "NSString",
  "block2",
] }

[target."cfg(windows)".dependencies]
# Unused since the seed map was removed (slimming phase 2); kept because dropping it removes winapi
# features other crates share and forces a full app-lib rebuild (see the launcher-mcp note above).
libloading = { workspace = true }
windows-version = "0.1.7"

[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Foundation",
  "UI_ViewManagement",
  "Win32_Graphics_Dwm",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
updater = []

[lints]
workspace = true
